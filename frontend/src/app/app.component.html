<div class="shell">
  <header class="topbar">
    <a routerLink="/register" class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-name">{{ title }}</span>
        <span class="brand-sub">Outpatient front desk</span>
      </span>
    </a>
    <nav class="nav" aria-label="Main">
      <a routerLink="/register" routerLinkActive="active">Register</a>
      <a routerLink="/queue" routerLinkActive="active" class="queue-link">
        Queue
        <span class="badge" [attr.data-count]="(waitingCount$ | async) ?? 0">
          {{ (waitingCount$ | async) ?? 0 }}
        </span>
      </a>
    </nav>
  </header>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
